name: sigao_voice
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core Audio & FFI
  ffi: ^2.1.0
  flutter_soloud: ^2.0.0
  provider: ^6.1.1
  permission_handler: ^11.3.0

  # UI Framework
  cupertino_icons: ^1.0.2
  flutter_contacts: ^1.1.8
  google_fonts: ^6.1.0
  url_launcher: ^6.2.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  uuid: ^4.2.2 # For CallKit IDs
  
  # Professional Integration
  flutter_callkit_incoming: ^2.0.0
  sodium: ^3.4.6
  sodium_libs: ^3.4.6+4
  # Using custom DTMF assets


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
